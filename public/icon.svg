<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" opacity="0.12" />
  
  <!-- POS Register & Invoice Icon Graphic -->
  <g transform="translate(106, 96)" filter="url(#shadow)">
    <!-- Base POS / Register Body -->
    <rect x="20" y="160" width="260" height="150" rx="20" fill="#ffffff" />
    <rect x="40" y="240" width="220" height="50" rx="10" fill="#f1f5f9" />
    
    <!-- Screen -->
    <rect x="40" y="50" width="220" height="100" rx="14" fill="#0f172a" />
    <rect x="55" y="65" width="190" height="70" rx="8" fill="#10b981" />
    
    <!-- Screen content: Dollar / Money / Invoice details -->
    <text x="150" y="112" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">$ IQD</text>
    
    <!-- Emerging Paper Receipt -->
    <path d="M 90 50 L 90 0 L 210 0 L 210 50 Z" fill="#ffffff" />
    <line x1="110" y1="14" x2="190" y2="14" stroke="#059669" stroke-width="4" stroke-linecap="round" />
    <line x1="110" y1="26" x2="175" y2="26" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="110" y1="38" x2="185" y2="38" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Cash drawer button indicator -->
    <circle cx="150" cy="265" r="10" fill="#059669" />
  </g>
</svg>
